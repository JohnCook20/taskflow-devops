name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"        # nightly regression build
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/taskflow

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests
      - run: pytest tests/test_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/junit.xml
            coverage.xml

  build:
    name: Build image + integration test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build and start stack
        run: |
          export APP_VERSION=${{ steps.meta.outputs.version }} APP_ENV=ci
          docker compose up -d --build
      - name: Smoke + integration tests
        run: |
          pip install -r requirements-dev.txt
          scripts/smoke_test.sh http://localhost:5000 ${{ steps.meta.outputs.version }}
          BASE_URL=http://localhost:5000 pytest tests/test_integration.py --no-cov
      - name: Prometheus is scraping the app
        run: |
          sleep 15
          curl -fsS 'http://localhost:9090/api/v1/targets' | grep -q '"health":"up"'
      - if: failure()
        run: docker compose logs
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (Release)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/taskflow" | tr '[:upper:]' '[:lower:]')
          V=${{ steps.meta.outputs.version }}
          docker tag taskflow:$V $IMAGE:$V
          docker tag taskflow:$V $IMAGE:latest
          docker push $IMAGE:$V
          docker push $IMAGE:latest

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging            # Settings > Environments > staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Deploy
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl apply -k k8s/overlays/staging
          kubectl -n taskflow-staging set image deployment/taskflow taskflow=$IMAGE:${{ needs.build.outputs.version }}
          kubectl -n taskflow-staging rollout status deployment/taskflow --timeout=120s
      - run: scripts/smoke_test.sh ${{ vars.STAGING_URL }} ${{ needs.build.outputs.version }}

  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production         # add "Required reviewers" here = manual approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Deploy
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl -n taskflow-production set image deployment/taskflow taskflow=$IMAGE:${{ needs.build.outputs.version }}
          kubectl -n taskflow-production rollout status deployment/taskflow --timeout=180s
      - run: scripts/smoke_test.sh ${{ vars.PROD_URL }} ${{ needs.build.outputs.version }}
