groups:
  - name: taskflow
    rules:
      - alert: TaskFlowDown
        expr: up{job="taskflow"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "TaskFlow is down"
      - alert: HighErrorRate
        expr: |
          sum(rate(taskflow_http_requests_total{status=~"5.."}[1m]))
            / clamp_min(sum(rate(taskflow_http_requests_total[1m])), 1e-9) > 0.05
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of requests are failing"
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(taskflow_http_request_duration_seconds_bucket[2m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 500ms"
