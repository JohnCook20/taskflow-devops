# Usage: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -l staging -e image=ghcr.io/USER/taskflow:1.0.7 -e app_version=1.0.7
# Needs: ansible-galaxy collection install community.docker
- name: Deploy TaskFlow container to cloud VM
  hosts: all
  become: true
  vars:
    app_env: "{{ group_names[0] }}"
    host_port: 80
  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: [docker.io, python3-docker]
        state: present
        update_cache: true
    - name: Ensure Docker is running
      ansible.builtin.service: {name: docker, state: started, enabled: true}
    - name: Run TaskFlow container
      community.docker.docker_container:
        name: taskflow
            pull: true
        state: started
        restart_policy: unless-stopped
        env:
          APP_ENV: "{{ app_env }}"
          APP_VERSION: "{{ app_version }}"
        published_ports: ["{{ host_port }}:5000"]
    - name: Wait for healthy service
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/health"
        return_content: true
      register: health
      retries: 15
      delay: 2
      until: health.status == 200 and app_version in health.content
