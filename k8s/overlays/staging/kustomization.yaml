apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskflow-staging
resources: [../../base, namespace.yaml]
patches:
  - target: {kind: Deployment, name: taskflow}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: staging}
  - target: {kind: HorizontalPodAutoscaler, name: taskflow}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 2}
