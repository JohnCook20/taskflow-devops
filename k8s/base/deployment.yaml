apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
  labels: {app: taskflow}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: taskflow}
  template:
    metadata:
      labels: {app: taskflow}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: taskflow
          image: ghcr.io/YOUR_GITHUB_USER/taskflow:latest     # overwritten by the pipeline
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_ENV, value: base}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
